{% extends 'core/base.html' %}

{% block title %}Sign In - FitTrack AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="background: #FFFFFF;">
    <div class="auth-header">
      <div class="logo-icon" style="width: 44px; height: 44px; margin: 0 auto 14px; font-size: 1.3rem; background: var(--gradient-primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: var(--shadow-emerald);">
        <i class="fas fa-lock"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your <strong>FitTrack AI</strong> account</p>
    </div>

    <form method="post" action="{% url 'signin' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="id_email">Email ID</label>
        {{ form.email }}
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" for="id_password" style="margin-bottom: 0;">Password</label>
          <a href="{% url 'forgot_password' %}" style="font-size: 0.8rem; color: var(--accent-cyan); text-decoration: none; font-weight: 600; font-family: 'JetBrains Mono', monospace;">Forgot password?</a>
        </div>
        <div class="password-input-wrapper">
          {{ form.password }}
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('id_password', this)" aria-label="Show password" title="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 6px;">
        <i class="fas fa-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-secondary);">
      Need an account? <a href="{% url 'register' %}" style="color: var(--accent-emerald); font-weight: 600; text-decoration: none;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
