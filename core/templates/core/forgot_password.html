{% extends 'core/base.html' %}

{% block title %}Forgot Password - FitTrack AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon" style="width: 48px; height: 48px; margin: 0 auto 16px; font-size: 1.5rem; background: var(--gradient-primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: #000;">
        <i class="fas fa-key"></i>
      </div>
      <h2>Reset Password</h2>
      <p>Enter your registered email ID to receive password reset instructions</p>
    </div>

    <form method="post" action="{% url 'forgot_password' %}">
      {% csrf_token %}
      
      <div class="form-group">
        <label class="form-label" for="id_email">Email ID</label>
        {{ form.email }}
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; margin-top: 10px; font-size: 1rem;">
        <i class="fas fa-paper-plane"></i> Send Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
      Remembered your password? <a href="{% url 'signin' %}" style="color: var(--accent-emerald); font-weight: 600; text-decoration: none;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
